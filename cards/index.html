<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lixo vs Luxo — Card Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <input id="key-trap" autocomplete="off" />

  <div class="card-anchor" id="card-anchor">
    <div class="card-slot" id="card-top"></div>
    <div class="card-slot" id="card-bot"></div>
  </div>

  <div class="history-panel" id="history-p1">
    <div class="history-title">Buffs</div>
    <ul class="history-list" id="history-list-p1"></ul>
  </div>

  <div class="history-panel" id="history-p2">
    <div class="history-title">Debuffs</div>
    <ul class="history-list" id="history-list-p2"></ul>
  </div>

  <script src="cards.js"></script>
  <script src="main.js"></script>
</body>
</html>
